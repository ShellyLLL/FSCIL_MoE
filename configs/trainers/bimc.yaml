SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 10
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

DATASET:
  SUPPORT_MANIFEST_PATH: ""
  SUPPORT_MANIFEST_SEED: -1
  SUPPORT_MANIFEST_AUTO_SAVE: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "amp"
    END_SESSION: -1


    FREEZE_TEXT_ENCODER: True
    FREEZE_VISUAL_BACKBONE: True

    VISUAL_MOE:
      ENABLE: True
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      BASE_SCALE_INIT: 0.5
      INCREMENTAL_REDUCTION: 48
      DESCRIPTOR_DIM: 64
      DESCRIPTOR_EPS: 1.0e-4
      DESCRIPTOR_BUFFER_SIZE: 500
      DESCRIPTOR_RESIDUAL_RANK: 16
      DESCRIPTOR_DENOISE_SCALE: 0.05
      DESCRIPTOR_RESIDUAL_WEIGHT: 1.0e-3
      EXPANSION_THRESHOLD_QUANTILE: 0.95
      EXPANSION_CALIBRATION_GROUPS: 256
      EXPANSION_CALIBRATION_SEED: 20261119
      INCREMENTAL_DROPOUT: 0.1
      INCREMENTAL_GATE_BIAS_INIT: -1.0
      SEMANTIC_TEMPERATURE: 0.07
      SEMANTIC_CALIBRATION_MAX_ALPHA: 0.5
      PROTOTYPE_RELIABILITY_K: 5.0
      FEATURE_SPACE_MIN_COSINE: 0.98
      FEATURE_SPACE_MAX_ACCURACY_DROP: 0.0
      FEATURE_SPACE_ANCHORS_PER_CLASS: 2
      FEATURE_SPACE_ANCHOR_BATCH_SIZE: 16

    INCREMENTAL:
      EPOCHS: 6
      LOGIT_SCALE: 100.0
      FEATURE_SPACE_PRESERVATION_WEIGHT: 1.0
      LOCAL_RESIDUAL_PRESERVATION_WEIGHT: 1.0
      RD_WEIGHT: 1.0

    CHECKPOINT:
      ENABLE: True
      DIR: "checkpoints/fscil_ae_unified"
      RESUME: ""
      SAVE_EVERY_SESSION: True

    OPTIM:
      BASE_EPOCHS: 50
      BASE_DESCRIPTOR_EPOCHS: 8
      LR_BASE_MOE: 1.0e-4
      LR_INCREMENTAL_EXPERT: 3.0e-4
      LR_INCREMENTAL_ROUTER: 3.0e-4
      LR_DESCRIPTOR: 1.0e-3
      WEIGHT_DECAY: 1.0e-4
      BETAS: [0.9, 0.999]

    LOSS:
      CE_WEIGHT: 1.0
      LB_WEIGHT: 0.01

