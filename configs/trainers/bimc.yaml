SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 10
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

DATASET:
  SUPPORT_MANIFEST_PATH: ""
  SUPPORT_MANIFEST_SEED: -1
  SUPPORT_MANIFEST_AUTO_SAVE: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "amp"
    END_SESSION: -1

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5
    INTER_MODAL_WEIGHT: 0.5

    FREEZE_TEXT_ENCODER: True
    FREEZE_VISUAL_BACKBONE: True

    VISUAL_MOE:
      ENABLE: True
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      BASE_SCALE_INIT: 0.5
      INCREMENTAL_REDUCTION: 48
      DESCRIPTOR_DIM: 64
      DESCRIPTOR_EPS: 1.0e-4
      DESCRIPTOR_BUFFER_SIZE: 500
      EXPANSION_Z_THRESHOLD: 1.0
      EXPANSION_FALSE_POSITIVE_RATE: 0.05
      AE_PRIOR_STRENGTH: 10.0
      INCREMENTAL_GATE_BIAS_INIT: -1.0

    INCREMENTAL:
      EPOCHS: 6
      LOGIT_SCALE: 100.0
      OLD_SUPPRESSION_WEIGHT: 1.0
      OLD_RESIDUAL_WEIGHT: 1.0
      ROUTE_WEIGHT: 1.0
      SPARSE_WEIGHT: 0.01
      ADAPTER_WEIGHT: 0.0001

    CHECKPOINT:
      ENABLE: True
      DIR: "checkpoints/fscil_ae_unified"
      RESUME: ""
      SAVE_EVERY_SESSION: True

    OPTIM:
      BASE_EPOCHS: 50
      BASE_DESCRIPTOR_EPOCHS: 8
      INCREMENTAL_DESCRIPTOR_EPOCHS: 5
      LR_BASE_MOE: 1.0e-4
      LR_INCREMENTAL_EXPERT: 3.0e-4
      LR_INCREMENTAL_ROUTER: 3.0e-4
      LR_DESCRIPTOR: 1.0e-3
      WEIGHT_DECAY: 1.0e-4
      BETAS: [0.9, 0.999]

    LOSS:
      CE_WEIGHT: 1.0
      LB_WEIGHT: 0.01
      KD_WEIGHT: 0.5

