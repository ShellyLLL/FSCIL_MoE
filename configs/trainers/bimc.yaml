SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 10
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

DATASET:
  SUPPORT_MANIFEST_PATH: ""
  SUPPORT_MANIFEST_SEED: -1
  SUPPORT_MANIFEST_AUTO_SAVE: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "amp"
    END_SESSION: -1

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    FREEZE_TEXT_ENCODER: True
    FREEZE_VISUAL_BACKBONE: True

    VISUAL_MOE:
      ENABLE: True
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      INCREMENTAL_REDUCTION: 48

    INCREMENTAL:
      EPOCHS: 6

    APC:
      ENABLE: True
      ALPHA: 0.05
      SIGNIFICANCE: 0.05

    PROTECTION:
      OLD_GATE_WEIGHT: 0.1
      MAX_OLD_GATE: 0.05

    CHECKPOINT:
      ENABLE: True
      DIR: "checkpoints/fscil_unified_moe"
      RESUME: ""
      SAVE_EVERY_SESSION: True

    OPTIM:
      BASE_EPOCHS: 50
      LR_BASE_MOE: 1.0e-4
      LR_INCREMENTAL_EXPERT: 3.0e-4
      LR_INCREMENTAL_ROUTER: 3.0e-4
      WEIGHT_DECAY: 1.0e-4
