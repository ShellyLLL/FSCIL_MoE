SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 10
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

DATASET:
  SUPPORT_MANIFEST_PATH: ""
  SUPPORT_MANIFEST_SEED: -1
  SUPPORT_MANIFEST_AUTO_SAVE: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "amp"

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    FREEZE_TEXT_ENCODER: True
    FREEZE_VISUAL_BACKBONE: True

    VISUAL_MOE:
      ENABLE: True
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      BASE_SCALE_INIT: 0.5
      INCREMENTAL_REDUCTION: 48
      TOP_K: 2
      ROUTE_MARGIN: 0.1
      ROUTE_UNCERTAINTY: 1.0
      ROUTE_INIT_GAP: 0.02
      ROUTE_INIT_TARGET_GAP: 0.5
      ROUTE_INIT_MAX_WEIGHT_NORM: 2.0
      ROUTE_ACTIVATION_WEIGHT: 1.0
      ROUTE_PRESERVATION_WEIGHT: 1.0
      ROUTE_PRESERVATION_TOLERANCE: 0.05
      EXPANSION_QUANTILE: 0.95
      EXPANSION_CONFIDENCE_Z: 1.0
      EXPANSION_MIN_GAIN: 0.001

    INCREMENTAL:
      EPOCHS: 6
      LOGIT_SCALE: 100.0

    CHECKPOINT:
      ENABLE: True
      DIR: "checkpoints/unified_dynamic_moe"
      RESUME: ""
      SAVE_EVERY_SESSION: True

    OPTIM:
      BASE_EPOCHS: 50
      LR_BASE_MOE: 1.0e-4
      LR_INCREMENTAL_EXPERT: 3.0e-4
      LR_INCREMENTAL_ROUTER: 1.0e-2
      WEIGHT_DECAY: 1.0e-4
      BETAS: [0.9, 0.999]

    LOSS:
      CE_WEIGHT: 1.0
      LB_WEIGHT: 0.01
      KD_WEIGHT: 0.5
