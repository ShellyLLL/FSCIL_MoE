SEED: 1

DEVICE:
  DEVICE_NAME: "cuda"
  GPU_ID: "0;"

DATALOADER:
  TRAIN:
    BATCH_SIZE_BASE: 64
    BATCH_SIZE_INC: 10
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 0

DATASET:
  SUPPORT_MANIFEST_PATH: ""
  SUPPORT_MANIFEST_SEED: -1
  SUPPORT_MANIFEST_AUTO_SAVE: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BiMC:
    PREC: "amp"
    END_SESSION: -1

    VISION_CALIBRATION: True
    LAMBDA_I: 0.1
    TAU: 16
    TEXT_CALIBRATION: True
    LAMBDA_T: 0.5

    FREEZE_TEXT_ENCODER: True
    FREEZE_VISUAL_BACKBONE: True

    VISUAL_MOE:
      ENABLE: True
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      BASE_SCALE_INIT: 0.5
      INCREMENTAL_REDUCTION: 48
      DESCRIPTOR_DIM: 64
      DESCRIPTOR_EPS: 1.0e-4

    INCREMENTAL:
      EPOCHS: 6
      LOGIT_SCALE: 100.0
      # Regularize the change in current-support image features relative to the
      # frozen previous model. Also included in candidate held-out selection.
      STABILITY_WEIGHT: 0.1

    CHECKPOINT:
      ENABLE: True
      DIR: "checkpoints/fscil_risk_stable"
      RESUME: ""
      SAVE_EVERY_SESSION: True

    OPTIM:
      BASE_EPOCHS: 50
      BASE_DESCRIPTOR_EPOCHS: 8
      INCREMENTAL_DESCRIPTOR_EPOCHS: 5
      LR_BASE_MOE: 1.0e-4
      LR_INCREMENTAL_EXPERT: 3.0e-4
      LR_INCREMENTAL_ROUTER: 3.0e-4
      LR_DESCRIPTOR: 1.0e-3
      WEIGHT_DECAY: 1.0e-4
      BETAS: [0.9, 0.999]

    LOSS:
      CE_WEIGHT: 1.0
      LB_WEIGHT: 0.01
      KD_WEIGHT: 0.5

    PROTOTYPE_REFINEMENT:
      ENABLE: False
      EPOCHS: 30
      LR: 1.0e-2
      OLD_PROTECT_WEIGHT: 1.0
      ANCHOR_WEIGHT: 1.0
      OLD_PROTECT_MARGIN: 0.70

    FUSED_CONFLICT_STRENGTH: 0.0
    FUSED_CONFLICT_MARGIN: 0.05

# Prototype-Confusion Guided Dynamic MoE-FSCIL (selected by main.py)
  PCMOE:
    ENABLE: True
    END_SESSION: -1
    TEXT_TEMPLATES:
      - "a photo of a {}."
      - "a photo of the {}."
      - "a close-up photo of a {}."
    VISUAL_MOE:
      INSERT_BLOCKS: [-4, -3, -2, -1]
      NUM_BASE_EXPERTS: 4
      BASE_REDUCTION: 4
      INCREMENTAL_REDUCTION: 16
      BASE_SCALE_INIT: 0.5
      TOP_K: 2
    CALIBRATION:
      INITIAL_TEMPERATURE_VISUAL: 0.1
      INITIAL_TEMPERATURE_TEXT: 0.1
      MIN_TEMPERATURE: 0.02
      MAX_TEMPERATURE: 2.0
      RELIABILITY_KAPPA: 2.0
      LAMBDA_VISUAL: 0.1
      VISUAL_TAU: 16.0
      LAMBDA_TEXT: 0.5
      INTER_MODAL_BETA: 0.3
    EXPANSION:
      APC_MIN_PERCENTILE: 0.8
      MAX_LAYERS_PER_SESSION: 4
      MIN_RISK_GAIN: 0.001
      MAX_OLD_CLASS_RISK_INCREASE: 0.01
      MAX_NEW_CLASS_RISK_INCREASE: 0.01
    OPTIM:
      BASE_EPOCHS: 50
      BASE_BATCH_SIZE: 64
      BASE_LR: 0.0001
      INCREMENTAL_EPOCHS: 10
      INCREMENTAL_LR: 0.0003
      WEIGHT_DECAY: 0.0001
    LOSS:
      ROUTE_BALANCE_WEIGHT: 0.01
      ROUTE_MARGIN: 0.05
      NEW_ROUTE_WEIGHT: 1.0
      HISTORICAL_ROUTE_WEIGHT: 1.0
      MAX_HISTORICAL_ROUTE_DRIFT: 0.05
      MAX_HISTORICAL_INTRUSION_RATE: 0.01
      MIN_DEMAND_ACTIVATION_RATE: 0.20
      MAX_NONDEMAND_ACTIVATION_RATE: 0.01
    CHECKPOINT:
      DIR: "checkpoints/prototype_confusion_moe"
      RESUME: ""
