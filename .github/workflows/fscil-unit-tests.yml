name: FSCIL unit tests

on:
  push:
    branches:
      - feature/fscil-ae-driven-unified-moe
    paths:
      - "**/*.py"
      - ".github/workflows/fscil-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.2 torchvision==0.17.2
          python -m pip install "numpy<2" scikit-learn==1.3.2 yacs==0.1.8 tqdm==4.66.1 ftfy==6.1.1 regex==2023.10.3 Pillow packaging

      - name: Compile Python sources
        run: python -m compileall -q engine models tests

      - name: Run unified MoE unit tests
        run: python -m unittest discover -s tests -p "test_risk_guided_moe.py" -v
