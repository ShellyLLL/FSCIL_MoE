name: FSCIL architecture tests

on:
  push:
    branches:
      - codex/fscil-unified-expansion-architecture
  pull_request:
    branches:
      - codex/fscil-unified-expansion-architecture

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project test dependencies
        run: |
          python -m pip install yacs==0.1.8 tqdm==4.66.1 ftfy==6.1.1 regex==2023.10.3 scikit-learn==1.3.2 pytest
      - name: Run architecture regression suite
        run: python -m pytest -q
