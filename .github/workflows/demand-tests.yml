name: Demand-driven FSCIL invariants
on:
  push:
    branches:
      - feature/fscil-demand-driven-bimodal-v2
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Compile changed modules
        run: python -m py_compile main.py models/clip/model.py models/bimc.py engine/demand.py engine/engine.py
      - name: Test historical-path and CV invariants
        run: python -m unittest discover -s tests -p 'test_demand.py' -v
