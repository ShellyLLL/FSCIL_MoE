name: Risk-Stable FSCIL with Few-Shot APC Tests

on:
  push:
    branches:
      - feature/prototype-confusion-dynamic-moe-fscil
    paths:
      - "models/bimc.py"
      - "models/clip/model.py"
      - "engine/engine.py"
      - "utils/apc.py"
      - "tests/test_risk_guided_moe.py"
      - "tests/test_few_shot_apc.py"
      - "main.py"
      - "configs/trainers/bimc.yaml"
      - ".github/workflows/pcmoe-architecture.yml"
  pull_request:
    branches:
      - feature/prototype-confusion-dynamic-moe-fscil

jobs:
  risk-stable-apc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow yacs ftfy regex tqdm scikit-learn packaging
      - name: Compile active modules
        run: |
          python -m py_compile models/bimc.py
          python -m py_compile engine/engine.py
          python -m py_compile utils/apc.py
          python -m py_compile main.py
          python -m py_compile tests/test_risk_guided_moe.py
          python -m py_compile tests/test_few_shot_apc.py
      - name: Run Risk-Stable and APC invariants
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_risk_guided_moe
          python -m unittest -v tests.test_few_shot_apc
