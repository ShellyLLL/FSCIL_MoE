name: Unified Dynamic MoE FSCIL Architecture

on:
  push:
    branches:
      - codex/unified-dynamic-moe-fscil
    paths:
      - "models/bimc.py"
      - "models/clip/model.py"
      - "engine/engine.py"
      - "tests/test_unified_dynamic_moe.py"
      - "main.py"
      - "configs/trainers/bimc.yaml"
      - ".github/workflows/pcmoe-architecture.yml"
  pull_request:
    branches:
      - codex/unified-dynamic-moe-fscil

jobs:
  unified-moe-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow yacs ftfy regex tqdm scikit-learn packaging
      - name: Compile active modules
        run: |
          python -m py_compile models/bimc.py
          python -m py_compile models/clip/model.py
          python -m py_compile engine/engine.py
          python -m py_compile main.py
          python -m py_compile tests/test_unified_dynamic_moe.py
      - name: Run unified architecture invariants
        env:
          PYTHONPATH: .
        run: python -m unittest -v tests.test_unified_dynamic_moe
